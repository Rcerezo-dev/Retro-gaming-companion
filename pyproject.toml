[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-manager-local"
version = "0.1.0"
description = "Local ROM manager for scanning, hashing, and organizing game files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
rommgr = "rom_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
# E722 (bare except) viene con "E". S110/S112 (flake8-bandit) prohíben tragar la
# excepción en silencio: un `except: pass` / `except: continue` sin acción ni log
# es un error de lint. Mínimo exigido: `logger.debug(..., exc_info=True)` (OBS-1c).
# No activamos BLE001 (catch-Exception) a propósito: el patrón best-effort con
# logging es deliberado y debe seguir permitido.
select = ["E", "F", "I", "UP", "S110", "S112"]
# Line length is owned by the formatter, not the lint gate (avoids ~400 manual reflows).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rom_manager"]
