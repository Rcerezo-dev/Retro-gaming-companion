name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # GHA-OPT-1b: un PR que solo toca backlog/docs no necesita revisión de
    # código con modelo — si ademas toca codigo, el workflow igual se dispara.
    paths-ignore:
      - "Tareas/**"
      - "**.md"

# GHA-OPT-1a: cada push (synchronize) relanzaba una revision completa sin
# cancelar la anterior — se observaron 5 corridas seguidas sobre la misma
# rama en una sola sesion (2026-08-14). Un push nuevo cancela la revision
# en curso en vez de apilarse.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # GHA-OPT-1b: no revisar mientras el PR sigue en borrador — solo cuenta
    # cuando pasa a "ready for review" (ese evento ya trae draft=false).
    if: github.event.pull_request.draft == false
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # GHA-OPT-1c: techo al coste de una corrida sobre un diff grande.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

