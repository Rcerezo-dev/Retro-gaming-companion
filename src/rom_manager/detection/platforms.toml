# Retro Vault — Definiciones de plataforma
# Fuente de verdad para la detección de plataforma por extensión y nombre de carpeta.
# Para personalizar sin perder las actualizaciones del programa, copia este archivo a:
#   .rommgr/platforms.toml
# Los valores de tu copia sobreescriben los de aquí.

