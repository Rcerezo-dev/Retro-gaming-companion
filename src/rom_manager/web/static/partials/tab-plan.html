<div id="tab-plan" class="tab">
  <h3 style="color:var(--c-blue);margin-bottom:8px">1. Renombrar</h3>
  <!-- Format options -->
  <div class="fmt-options">
    <span>Incluir en el nombre:</span>
    <label class="fmt-check">
      <input type="checkbox" id="fmt-region" checked onchange="loadPlan()"> Región
    </label>
    <label class="fmt-check">
      <input type="checkbox" id="fmt-revision" checked onchange="loadPlan()"> Revisión
    </label>
    <label class="fmt-check">
      <input type="checkbox" id="fmt-platform" onchange="loadPlan()"> Plataforma
    </label>
    <label class="fmt-check">
      <input type="checkbox" id="fmt-sha" onchange="loadPlan(); toggleShaLength()"> SHA
    </label>
    <label class="fmt-check hidden" id="sha-length-label">
      <span style="color:var(--c-muted);font-size:11px;margin-right:4px">Dígitos:</span>
      <select id="fmt-sha-length" onchange="loadPlan()"
        style="background:var(--c-input);border:1px solid #444;color:var(--c-text);padding:2px 6px;border-radius:4px;font:inherit;font-size:12px">
        <option value="8" selected>8</option>
        <option value="12">12</option>
        <option value="16">16</option>
        <option value="40">40 (completo)</option>
      </select>
    </label>
    <div style="display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap">
      <!-- PLAN-UX-3: el filtro por dispositivo se retiró — el selector global PC/Consola ya cumple esa función -->
      <button id="btn-apply" class="btn primary" onclick="doApply()" disabled>Renombrar</button>
      <button id="btn-resolve-conflicts" class="btn hidden" onclick="applyKeepBoth()">Resolver conflictos</button>
    </div>
  </div>
  <!-- Barra de progreso del apply -->
  <div class="hidden rv-tint-info" id="apply-progress-wrap" style="margin-bottom:10px;padding:8px 12px;border-radius:4px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span id="apply-progress-label" style="font-size:12px;color:var(--c-lblue)">Renombrando…</span>
      <span id="apply-progress-pct" style="font-size:12px;color:var(--c-muted)">0%</span>
    </div>
    <div style="background:var(--bg-track);border-radius:3px;height:6px;overflow:hidden">
      <div id="apply-progress-bar" style="height:100%;background:var(--c-blue);width:0%;transition:width .2s"></div>
    </div>
  </div>
  <!-- D8-2: apply error details panel -->
  <div class="hidden rv-tint-warn" id="apply-error-details" style="margin-bottom:10px;padding:10px 14px;border-radius:4px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <span style="color:var(--c-red);font-size:12px;font-weight:600" id="apply-error-count"></span>
      <button class="btn danger" style="padding:2px 8px;font-size:11px" onclick="document.getElementById('apply-error-details').style.display='none'">Cerrar</button>
    </div>
    <div id="apply-error-list" style="max-height:200px;overflow-y:auto;font-size:11px;font-family:monospace;color:var(--c-softred)"></div>
  </div>
  <div class="hidden" id="fmt-preview" style="font-size:12px;color:var(--c-muted);margin-bottom:12px;padding:6px 10px;background:var(--c-bar);border:1px solid #2a2a3a;border-radius:4px">
    <span style="color:var(--c-dim)">Ejemplo: </span><span id="fmt-preview-text" style="color:var(--c-teal)"></span>
  </div>
  <!-- Resumen C2: X listos · Y conflictos · Z sin match -->
  <div class="hidden" id="plan-summary-bar" style="margin-bottom:10px;padding:8px 14px;background:var(--c-panel);border:1px solid var(--c-border);border-radius:4px;font-size:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"></div>
  <div class="hidden" id="plan-context-bar" style="margin-bottom:10px;padding:7px 12px;background:var(--c-panel);border:1px solid var(--c-border);border-radius:4px;font-size:12px;color:var(--c-muted)"></div>
  <div id="plan-content"><p class="loading">Cargando…</p></div>

  <!-- TABS-FIX-6: cola única que fusiona duplicados SHA1/semánticos/RA y
       colisiones del plan — reemplaza la pestaña Duplicados. -->
  <h3 style="color:var(--c-blue);margin:24px 0 8px">2. Revisar copias</h3>
  <div style="margin-bottom:10px">
    <button id="btn-review-apply-all" class="btn primary hidden" onclick="applyAllReviewRecommendations()">Aplicar todas las recomendaciones</button>
  </div>
  <div id="review-queue-content"><p class="loading">Cargando…</p></div>
</div>
