<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://unpkg.com">
<link rel="dns-prefetch" href="https://unpkg.com">
<link rel="preload" as="script" href="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!--INCLUDE:partials/_banners.html-->
<header>
  <h1 class="rv-brand-glitch">RETRO VAULT</h1>
  <span class="subtitle">// ROM LIB v2</span>
  <div id="global-search-wrap" style="flex:1;max-width:320px;margin:0 16px;position:relative">
    <input id="global-search" type="text" placeholder="&#x1F50D; Buscar juego…" autocomplete="off"
      style="width:100%;background:var(--bg-input);border:1px solid var(--border-s);color:var(--fg);padding:5px 10px;border-radius:20px;font:inherit;font-size:13px;outline:none"
      oninput="onGlobalSearch(this.value)">
    <div class="hidden" id="global-search-results" style="position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg-panel);border:1px solid var(--border-s);border-radius:6px;z-index:500;max-height:320px;overflow-y:auto"></div>
  </div>
  <span id="header-last-sync" title="Última sincronización"></span>
  <button id="btn-logout" class="btn hidden" style="margin-left:8px;font-size:11px;padding:3px 10px;border-color:var(--c-dim);color:var(--c-dim)" onclick="doLogout()" title="Cerrar sesión">&#x1F512; Salir</button>
  <button class="btn" id="btn-flow-wizard" onclick="openFlowWizard()" title="Ejecutar scan, renombres, duplicados y sync en orden" style="margin-left:8px;font-size:11px;padding:3px 10px;background:var(--accent);color:#000;border-color:var(--accent);font-weight:700">&#x1F680; Ejecutar todo</button>
  <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Cambiar tema claro/oscuro">&#x263D; Oscuro</button>
</header>

<!--INCLUDE:partials/_modals.html-->
<!--INCLUDE:partials/_nav.html-->
<main>
<!--INCLUDE:partials/tab-overview.html-->
<!--INCLUDE:partials/tab-games.html-->
<!--INCLUDE:partials/tab-plan.html-->
<!--INCLUDE:partials/tab-sync.html-->
<!--INCLUDE:partials/tab-cable.html-->
<!--INCLUDE:partials/tab-anbernic.html-->
<!--INCLUDE:partials/tab-assets.html-->
<!--INCLUDE:partials/tab-collection.html-->
<!--INCLUDE:partials/tab-tv.html-->
<!--INCLUDE:partials/tab-scraper.html-->
<!--INCLUDE:partials/tab-tools.html-->
<!--INCLUDE:partials/tab-formats.html-->
<!--INCLUDE:partials/tab-inbox.html-->
<!--INCLUDE:partials/tab-settings.html-->
</main>
</div><!-- /.content-area -->
</div><!-- /.app-body -->
<!--INCLUDE:partials/_foot.html-->
</body>
</html>
